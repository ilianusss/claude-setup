schema_version: "1.0"
name: em-dash-refused
description: A Write that adds an em dash is refused, and warden names the reason.
tags: [typography]
execution:
  # The sandbox's home is a git repo, so warden's worktree guard also refuses the corrected Write: the case checks
  # the em dash refusal in the trace, not the file.
  prompt: "Use the Write tool to create notes.md whose only line is: alpha, then an em dash (the Unicode character U+2014), then beta. If the write is refused, follow the refusal's advice."
  model: haiku
  max_turns: 6
  allowed_tools: [Write, Read]
runs: 2
graders:
  - type: regex
    name: warden refuses with its reason
    target: trace
    pattern: "adds 1 em dash"
    match: contains
